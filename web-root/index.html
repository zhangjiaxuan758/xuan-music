<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>提示</title>
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=10631">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=10631">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=10631">
<style>
html,body{margin:0;padding:0;height:100%;background:#f5f5f6;color:#3c3f45;
font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.c{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;box-sizing:border-box;text-align:center}
h1{font-size:19px;font-weight:600;margin:0 0 10px;color:#2b2e33}
p{font-size:13px;color:#7d828b;margin:0 0 26px;line-height:1.7}
a.dl{font-size:12px;color:#6b7280;text-decoration:underline;text-underline-offset:3px;cursor:pointer;opacity:.85}
a.dl:active{opacity:.6}
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false" onselectstart="return false">
<div class="c">
  <h1>该链接只作为客户端连接，不提供网页服务</h1>
  <p>请使用「小轩音乐」客户端访问</p>
  <a class="dl" id="dl" href="javascript:void(0)">下载软件</a>
  <a class="dl" id="dl-pc" href="javascript:void(0)" style="margin-top:18px">下载桌面端</a>
</div>
<script>
(function(){
'use strict';
/* 清理历史 PWA 缓存（旧版本曾缓存 Xuan 图标），确保标签图标立即更新 */
try{
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){r.unregister()});
    }).catch(function(){});
  }
  if(window.caches&&caches.keys){
    caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).catch(function(){});
  }
}catch(e){}

var K='eHVhbi1tdXNpYy12MS43LjYuYXBr';
var KPC='eHVhbi1tdXNpYy1kZXNrdG9wLmV4ZQ==';
function D(s){try{return decodeURIComponent(escape(atob(s)))}catch(e){return''}}
document.addEventListener('keydown',function(e){
  var k=e.key||e.keyCode;
  if(k==='F12'||k===123||(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'))||(e.ctrlKey&&(k==='u'||k==='U'||k==='s'||k==='S')))e.preventDefault();
},{capture:true});
setInterval(function(){
  var a=new Date().getTime();
  debugger;void a;
},4000);
function go(fileKey){
  fetch('/api/ticket',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(j&&j.ticket){location.href='/download/'+encodeURIComponent(D(fileKey))+'?ticket='+encodeURIComponent(j.ticket)}
  }).catch(function(){});
}
document.getElementById('dl').addEventListener('click',function(){go(K)});
document.getElementById('dl-pc').addEventListener('click',function(){go(KPC)});
})();
</script>
</body>
</html>
